services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestao_contas
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: contas123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d gestao_contas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/gestao_contas
      DB_USER: contas
      DB_PASSWORD: contas123
      CORS_ALLOWED_ORIGINS: http://localhost:4201
    ports:
      - "8081:8080"

      

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4201:80"

volumes:
  pgdata: