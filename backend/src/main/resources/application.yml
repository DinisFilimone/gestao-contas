spring:
  application:
    name: gestao-contas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gestao_contas}
    username: ${DB_USER:contas}
    password: ${DB_PASSWORD:contas123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

# Valores de DESENVOLVIMENTO. Em producao definir JWT_SECRET e ADMIN_PASSWORD por variavel de ambiente.
app:
  jwt:
    secret: ${JWT_SECRET:chave-secreta-de-desenvolvimento-troque-em-producao-0123456789}
    expiration-minutes: 60
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
